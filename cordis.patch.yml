# 由 dsh-vault 面板生成，也可以手改（改完 HMR 生效）。
- insert:
    - id: vault
      name: 'dsh-vault'
      config:
        targets:
          - name: 'skills'
            repo:
              url: 'git@github.com:faintspire/dsh-skills.git'
              branch: 'main'
              workdir: 'C:\Users\liuzk\.dsh\vault\dsh-skills'
            skills:
              - 'C:\Users\liuzk\.dsh\skills'
              - 'C:\Users\liuzk\.agents\skills'
          - name: 'memory'
            repo:
              url: 'git@github.com:faintspire/dsh-memory.git'
              branch: 'main'
              workdir: 'C:\Users\liuzk\.dsh\vault\dsh-memory'
            dirs:
              - 'C:\Users\liuzk\.mnemon\runtime'
              - 'C:\Users\liuzk\.mnemon\documents'
          - name: 'mcp'
            repo:
              url: 'git@github.com:faintspire/dsh-mcp.git'
              branch: 'main'
              workdir: 'C:\Users\liuzk\.dsh\vault\dsh-mcp'
            files: []
        schedule:
          enabled: true
          time: '03:30'
        secretPolicy: 'block'
        maxFileBytes: 1048576

        # 提交者身份与 SSH 私钥。留空就用本机 git 的全局配置和默认 key。
        git:
          userName: 'liuzk'
          userEmail: '2824996801@qq.com'
          sshKeyPath: 'C:\Users\liuzk\.ssh\id_ed25519'
